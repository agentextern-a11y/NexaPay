workflows:
  ios-nexapay:
    name: NexaPay iOS

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexa-pay.app

      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Pods
        script: cd ios && pod install

      - name: Build
        script: |
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

    publishing:
      app_store_connect:
        auth: integration
        team_id: H4QUDPK7S3
        submit_to_testflight: true
