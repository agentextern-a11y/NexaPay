workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production (Stable)

    max_build_duration: 90

    integrations:
      app_store_connect: tiligo_asc

    environment:
      xcode: latest

      vars:
        FLUTTER_BUILD_MODE: release

    cache:
      cache_paths:
        - node_modules
        - ios/Pods
        - ~/.pub-cache

    scripts:

      # -------------------------
      # 1. VALIDATION LAYER
      # -------------------------
      - name: Validate environment
        script: |
          set -e
          node -v
          npm -v

      # -------------------------
      # 2. DEPENDENCIES (FIXED NPM FAIL SAFE)
      # -------------------------
      - name: Install dependencies
        script: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # -------------------------
      # 3. iOS POD INSTALL
      # -------------------------
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update

      # -------------------------
      # 4. VERIFY STRUCTURE
      # -------------------------
      - name: Verify iOS workspace
        script: |
          set -e
          test -f ios/Runner.xcworkspace

      # -------------------------
      # 5. CLEAN BUILD
      # -------------------------
      - name: Clean build
        script: |
          xcodebuild clean \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      # -------------------------
      # 6. ARCHIVE
      # -------------------------
      - name: Build archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

      # -------------------------
      # 7. EXPORT IPA
      # -------------------------
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
