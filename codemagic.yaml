workflows:
  nexapay-ios-locked:
    name: NexaPay iOS Locked Pipeline

    max_build_duration: 90

    integrations:
      app_store_connect: tiligo_asc

    environment:
      xcode: latest

      vars:
        ROOT_DIR: "$CM_BUILD_DIR/clone"

    cache:
      cache_paths:
        - ~/.cache/yarn
        - ios/Pods
        - ~/Library/Caches/CocoaPods

    scripts:

      # -------------------------
      # 1. HARD ROOT ENFORCEMENT
      # -------------------------
      - name: Lock workspace root
        script: |
          set -e
          cd $ROOT_DIR

          echo "LOCKED ROOT:"
          pwd

          test -f package.json
          test -f yarn.lock

      # -------------------------
      # 2. COREPACK + YARN BERRY LOCK
      # -------------------------
      - name: Activate Yarn
        script: |
          cd $ROOT_DIR

          corepack enable
          corepack prepare yarn@stable --activate

          yarn -v

      # -------------------------
      # 3. DETERMINISTIC INSTALL (NO DRIFT)
      # -------------------------
      - name: Install dependencies (locked)
        script: |
          cd $ROOT_DIR

          export YARN_IGNORE_PATH=1

          yarn install --immutable

      # -------------------------
      # 4. IOS POD INSTALL
      # -------------------------
      - name: Install CocoaPods
        script: |
          cd $ROOT_DIR/ios

          pod install --repo-update

      # -------------------------
      # 5. VERIFY IOS BUILD ENTRYPOINT
      # -------------------------
      - name: Verify Xcode workspace
        script: |
          cd $ROOT_DIR/ios

          test -f Runner.xcworkspace

      # -------------------------
      # 6. CLEAN BUILD (DETERMINISTIC)
      # -------------------------
      - name: Clean build
        script: |
          cd $ROOT_DIR

          xcodebuild clean \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      # -------------------------
      # 7. ARCHIVE (SIGNED)
      # -------------------------
      - name: Build archive
        script: |
          cd $ROOT_DIR

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

      # -------------------------
      # 8. EXPORT IPA
      # -------------------------
      - name: Export IPA
        script: |
          cd $ROOT_DIR

          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
