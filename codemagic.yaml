workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production (Locked Stable)

    max_build_duration: 90

    integrations:
      app_store_connect: tiligo_asc

    environment:
      xcode: latest

      vars:
        FLUTTER_BUILD_MODE: release

    cache:
      cache_paths:
        - ~/.cache/yarn
        - ios/Pods
        - ~/Library/Caches/CocoaPods

    scripts:

      # -------------------------
      # 1. FORCE CLEAN PACKAGE STATE
      # -------------------------
      - name: Clean workspace
        script: |
          rm -rf node_modules
          rm -f package-lock.json pnpm-lock.yaml

      # -------------------------
      # 2. ENABLE YARN (COREPACK)
      # -------------------------
      - name: Setup Yarn
        script: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      # -------------------------
      # 3. INSTALL DEPENDENCIES (YARN ONLY)
      # -------------------------
      - name: Install dependencies
        script: |
          yarn install --frozen-lockfile

      # -------------------------
      # 4. IOS PODS
      # -------------------------
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      # -------------------------
      # 5. VERIFY IOS STRUCTURE
      # -------------------------
      - name: Verify workspace
        script: |
          test -f ios/Runner.xcworkspace

      # -------------------------
      # 6. CLEAN XCODE BUILD
      # -------------------------
      - name: Clean build
        script: |
          xcodebuild clean \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      # -------------------------
      # 7. ARCHIVE BUILD (AUTOMATIC SIGNING)
      # -------------------------
      - name: Build archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

      # -------------------------
      # 8. EXPORT IPA
      # -------------------------
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
