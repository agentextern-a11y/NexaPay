workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production (Hardened)

    max_build_duration: 90

    environment:
      xcode: 15.4

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexa-pay.app

      vars:
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        FLUTTER_BUILD_MODE: release

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods
        - ~/Library/Caches/CocoaPods

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      # -------------------------
      # 1. Environment sanity check
      # -------------------------
      - name: Validate environment
        script: |
          set -e
          xcodebuild -version
          pod --version || sudo gem install cocoapods

      # -------------------------
      # 2. Dependency install
      # -------------------------
      - name: Install dependencies
        script: |
          set -e
          npm ci

      # -------------------------
      # 3. iOS Pods (clean + deterministic)
      # -------------------------
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod deintegrate || true
          pod install --repo-update

      # -------------------------
      # 4. Verify workspace integrity
      # -------------------------
      - name: Verify Xcode workspace
        script: |
          set -e
          ls ios/*.xcworkspace

      # -------------------------
      # 5. Clean build (prevents stale artifacts)
      # -------------------------
      - name: Clean build folder
        script: |
          set -e
          xcodebuild clean -workspace ios/*.xcworkspace -scheme Runner

      # -------------------------
      # 6. Archive build
      # -------------------------
      - name: Build iOS archive
        script: |
          set -e
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/NexaPay.xcarchive \
            archive

      # -------------------------
      # 7. Export IPA deterministically
      # -------------------------
      - name: Export IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/NexaPay.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/

      # -------------------------
      # 8. Validate output artifact exists
      # -------------------------
      - name: Verify IPA output
        script: |
          set -e
          ls build/*.ipa

    artifacts:
      - build/*.ipa
      - build/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration

        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        submit_to_testflight: true

        beta_groups:
          - internal-testers
