workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production

    integrations:
      app_store_connect: tilgo_asc

    environment:
      xcode: 15.4

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexa-pay.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Pods
        script: cd ios && pod install --repo-update

      - name: Build
        script: |
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
