workflows:
  ios-production:
    name: NexaPay iOS Production

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: NexaPayASC

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexa-pay.app

      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods
        - ~/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - flutter pub get
      - flutter clean

      - name: Install Pods
        script: |
          cd ios
          pod repo update
          pod install
          cd ..

      - flutter analyze
      - flutter test || true
      - flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
