workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production (PNPM Stable)

    max_build_duration: 90

    integrations:
      app_store_connect: tiligo_asc

    environment:
      xcode: latest

    scripts:

      # -------------------------
      # 1. ENABLE COREPACK + PNPM
      # -------------------------
      - name: Setup pnpm
        script: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v

      # -------------------------
      # 2. INSTALL DEPENDENCIES (FIXED)
      # -------------------------
      - name: Install dependencies (pnpm)
        script: |
          pnpm install --frozen-lockfile=false

      # -------------------------
      # 3. IOS PODS
      # -------------------------
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      # -------------------------
      # 4. VERIFY IOS STRUCTURE
      # -------------------------
      - name: Verify workspace
        script: |
          test -f ios/Runner.xcworkspace

      # -------------------------
      # 5. CLEAN BUILD
      # -------------------------
      - name: Clean build
        script: |
          xcodebuild clean \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      # -------------------------
      # 6. ARCHIVE
      # -------------------------
      - name: Build archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
