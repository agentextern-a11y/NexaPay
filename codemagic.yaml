workflows:
  ios-nexapay-prod:
    name: NexaPay iOS Production (Stable Yarn Fix)

    max_build_duration: 90

    integrations:
      app_store_connect: tiligo_asc

    environment:
      xcode: latest

      vars:
        YARN_ENABLE_IMMUTABLE_INSTALLS: "true"

    scripts:

      # -------------------------
      # 1. FORCE CORRECT ROOT DIRECTORY
      # -------------------------
      - name: Fix workspace path
        script: |
          cd $CM_BUILD_DIR
          pwd
          ls

      # -------------------------
      # 2. COREPACK + YARN BERRY FIX
      # -------------------------
      - name: Setup Yarn
        script: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      # -------------------------
      # 3. CLEAN INSTALL (FIXED BERRY MODE)
      # -------------------------
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR

          # critical: avoid root confusion
          export YARN_IGNORE_PATH=1

          yarn install --immutable

      # -------------------------
      # 4. IOS PODS
      # -------------------------
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      # -------------------------
      # 5. VERIFY STRUCTURE
      # -------------------------
      - name: Verify project structure
        script: |
          cd $CM_BUILD_DIR
          test -f package.json
          test -f yarn.lock

      # -------------------------
      # 6. CLEAN BUILD
      # -------------------------
      - name: Clean build
        script: |
          xcodebuild clean \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      # -------------------------
      # 7. ARCHIVE
      # -------------------------
      - name: Build archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/app.xcarchive \
            archive

      # -------------------------
      # 8. EXPORT IPA
      # -------------------------
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/app.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - internal-testers
